server:
  port: 8081

jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD}
    algorithm: ${JASYPT_ALGORITHM}
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

spring:
  config:
    import: "optional:file:.env[.properties]"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-1.5-flash
    anthropic:
      api-key: ${CLAUDE_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-6
    groq:
      api-key: ${GROQ_API_KEY}
      base-url: "https://api.groq.com/openai"
      model: "meta-llama/llama-4-scout-17b-16e-instruct"
      max-tokens: 4096
    openai:
      api-key: "dummy"  # groq에서 수동으로 OpenAiApi 생성하므로 auto-config 비활성화용

thinq:
  pat-token: ${THINQ_PAT_TOKEN}
  base-url: ${THINQ_BASE_URL}
  api-key: ${THINQ_API_KEY}
  client-id: ${THINQ_CLIENT_ID}

logging:
  level:
    org.springframework.ai: DEBUG

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}